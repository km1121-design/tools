<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>配送ルート管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }
        .transition-all {
            transition-property: all;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 300ms;
        }
        @media print {
            body * { visibility: hidden; }
            #report-section, #report-section * { visibility: visible; }
            #report-section { position: absolute; left: 0; top: 0; width: 100%; padding: 0; margin: 0; }
            .no-print { display: none !important; }
            .print-bg { background-color: white !important; }
        }
        #toast {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(31, 41, 55, 0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 9999px;
            font-weight: bold;
            z-index: 50;
            text-align: center;
            width: 90%;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <!-- ピン位置の修正 -->
    <div id="pin-modal" class="hidden fixed inset-0 z-40 bg-black/60 flex items-end sm:items-center justify-center">
        <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl overflow-hidden">
            <div class="p-4 pb-2">
                <h2 class="text-lg font-bold" id="pin-title">ピン位置の修正</h2>
                <p class="text-xs text-gray-500 mt-1">地図をタップするか、ピンをドラッグして納品先の位置に合わせてください。</p>
            </div>
            <div id="pin-map" style="height: 55vh;"></div>
            <div class="p-4 space-y-2">
                <button onclick="pinToCurrentLocation()" class="w-full py-2.5 rounded-xl bg-gray-100 text-gray-700 font-bold">📍 現在地に合わせる</button>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="closePinEditor()" class="py-3 rounded-xl bg-white border border-gray-300 text-gray-700 font-bold">キャンセル</button>
                    <button onclick="savePin()" class="py-3 rounded-xl bg-blue-600 text-white font-bold">この位置で保存</button>
                </div>
                <button id="pin-reset" onclick="resetPin()" class="w-full py-2 text-xs font-bold text-red-500 underline">ピンを削除して住所で案内に戻す</button>
            </div>
        </div>
    </div>
    <div id="toast">コピーしました！LINE等に貼り付けてください。</div>

    <script>
        // 納品先データ
        const initialDeliveryData = [
            { id: 1, name: "白樺", address: "銀座7-2-16-6階", category: "", payment: "", frequency: "週1~2", note: "人が居たら店内へ(指示有り)、居なければEV降りて左側に置く。直送納品されている場合の発泡もあれば回収。", timeLimit: "" },
            { id: 2, name: "エスペロ", address: "銀座5-6-10 B1F", category: "洋食", payment: "", frequency: "ほぼ毎日少量", note: "店内調理場まで、中身だけ。", timeLimit: "" },
            { id: 3, name: "わびさび本店", address: "新橋2-9-6烏森神社ビル3F", category: "居酒屋", payment: "", frequency: "月~金", note: "人がいれば店内入って正面のキッチンに中身だけ、いなければEV降りて右側に置く。", timeLimit: "" },
            { id: 4, name: "福炎や", address: "新橋2-9-6烏森神社ビル4F", category: "居酒屋", payment: "", frequency: "月~金", note: "中身＋氷もお渡し。＊氷お渡しを基本この店舗のみ", timeLimit: "" },
            { id: 5, name: "ダイヤモンドフィッシュ", address: "新橋2-9-6烏森神社ビル5F", category: "洋食", payment: "", frequency: "月~金", note: "人がいれば中身だけ、いなければEV降りて左側に置く。", timeLimit: "" },
            { id: 6, name: "ひろ", address: "新橋2-2-4パイオニアビル3F", category: "居酒屋", payment: "", frequency: "週3~4", note: "人がいれば店内カウンターへ中身だけ、居なければEV降りて左側に置く。前日の発泡あれば回収。", timeLimit: "" },
            { id: 7, name: "多助", address: "新橋3-2-3ルグランシェビル2F", category: "居酒屋", payment: "", frequency: "週3~4", note: "店内入って直ぐの御座敷前で確認。量によってはそのまま中身をもっていく場合と、発泡ごと一旦厨房へもっていき中身を取り出したのち、発泡（＋氷）をもらう場合あり。（指示に従う）店外奥に発泡ある場合があるので確認。", timeLimit: "" },
            { id: 8, name: "のとじ 能登治", address: "新橋3-7-5能登治ビル1F", category: "蕎麦屋", payment: "", frequency: "木", note: "地下に降り、中身だけ。蒲鉾は右側冷蔵庫中段、冷凍エビは左側冷凍庫に先入れ先出し。伝票はマグネットで挟む。納品後1階へ声掛け。", timeLimit: "" },
            { id: 9, name: "Hachi", address: "日本橋小舟町14-12", category: "洋食", payment: "", frequency: "週2~3", note: "★後回しでもOK。（桃源郷11時半間に合わない場合はカポペリのあとにまわす）人がいれば店内入って足元へ、居なければ店舗前に置く。", timeLimit: "" },
            { id: 10, name: "和食の故郷", address: "内神田2-14-13高芳ビルB1F", category: "居酒屋", payment: "", frequency: "週3~4", note: "階段コーナーに置く。発泡あれば回収。", timeLimit: "" },
            { id: 11, name: "赤兵衛", address: "内神田3-22-1勝田ビル2F", category: "居酒屋", payment: "", frequency: "週3~4", note: "店舗入口前（2階）に置く。シャッター閉まってたら開けて2階の店舗入口前に置く。発泡は1階外に置いてあれば回収。", timeLimit: "" },
            { id: 12, name: "しょうげつあん 松月庵", address: "神田司町2-6-19", category: "蕎麦屋", payment: "集金", frequency: "月・金", note: "正面入口から入り、厨房までいき、奥の地下に降り冷蔵庫に先入れ先出しで中身だけ。蒲鉾(中段右扉)、鴨肉(上段左扉)、海老(上段右扉)、乾き物は手渡し。", timeLimit: "12時〜13時 納品NG" },
            { id: 13, name: "とうげんきょう 桃源郷", address: "神田小川町1-11クロスタB1F", category: "居酒屋", payment: "", frequency: "ほぼ毎日", note: "★11時半までに行く。出発が遅れた場合は能登路のあとに向かうのが良い。店内カウンターへ中身だけ。ランチタイムに重なる際は要注意。万が一11時半以降でランチタイムにかさなってしまった場合は、カウンターへおけないので指示に従う。その際はきちんと謝罪。", timeLimit: "11時半までに行く" },
            { id: 14, name: "ふじみ 藤海", address: "外神田2-13-10ダイニチビルB1F", category: "居酒屋", payment: "", frequency: "ほぼ毎日", note: "EV降りた正面に置く。（店内人いても置き配でOK）前日の発泡回収。", timeLimit: "" },
            { id: 15, name: "ともえや 巴屋", address: "本郷2-13-10", category: "蕎麦屋", payment: "集金", frequency: "月", note: "店舗入口は使用禁止。必ず向かって右扉側から入る。厨房の奥で中身だけ。", timeLimit: "12時〜13時 納品NG" },
            { id: 16, name: "あさひや", address: "本郷6-17-6", category: "蕎麦屋", payment: "集金", frequency: "月・火", note: "店舗入口は使用禁止。向かって右側の裏口側から入る。集金金額を口頭で伝える。左側の台の上に中身だけ。冷凍エビも箱から出して箱回収。", timeLimit: "12時〜13時 納品NG" },
            { id: 17, name: "カポペリカーノ", address: "本郷7-3-1医学部教育研究棟", category: "洋食(13F)・おにぎり(1F)", payment: "", frequency: "週2~3", note: "納品書は13Fへ(1Fのみ納品時は1FでOK)。1Fはおにぎり具材、13Fは店舗入口向かって左の青扉開けた左の台へ納品。直接はNGなので（汚いため）店舗の方にきちんと「海老徳です」と声をかけ、トレイをだしていただき、トレイに納品。", timeLimit: "" },
            { id: 18, name: "りょうざんぱく 梁山泊", address: "墨田区緑2-14-3", category: "居酒屋", payment: "", frequency: "火・金", note: "店内奥のカウンターへ中身だけ。", timeLimit: "" },
            { id: 19, name: "いっそん 一村", address: "江東区深川2-1-2岡野ビル2F", category: "居酒屋", payment: "", frequency: "ほぼ毎日", note: "人がいれば店内カウンターへ発泡ごとおく。居なければEV降りて置く。前日の発泡回収。", timeLimit: "" },
            { id: 20, name: "ぞろめ 沿露目", address: "江東区富岡1-12-6阿久津ビル1F", category: "居酒屋", payment: "", frequency: "ほぼ毎日", note: "店内すぐのカウンターへ中身だけ。", timeLimit: "" },
            { id: 21, name: "ぱんから 蛮殼", address: "月島1-25-7", category: "居酒屋", payment: "", frequency: "ほぼ毎日", note: "店内奥カウンター下へ発泡ごとおく。入口付近にある前日の発泡を回収。", timeLimit: "" },
            { id: 22, name: "やなぎ家", address: "足立区柳原2-18-8", category: "蕎麦屋", payment: "集金", frequency: "土(月に1~2)", note: "店内カウンターへ中身だけ。", timeLimit: "12時〜13時 納品NG" },
            { id: 23, name: "清かわ", address: "江戸川区南葛西2-22-1", category: "蕎麦屋", payment: "集金", frequency: "土", note: "店内カウンターへ中身だけ。", timeLimit: "12時〜13時 納品NG" },
            { id: 24, name: "そうま 相馬屋", address: "中央区佃2-6-3", category: "蕎麦屋", payment: "集金", frequency: "月に1~2", note: "店内カウンターへ中身だけ。", timeLimit: "12時〜13時 納品NG" }
        ];

        // 状態管理
        let routeList = JSON.parse(JSON.stringify(initialDeliveryData));
        let quantities = {};
        let itemStatuses = {};
        let collections = {}; // 集金額（円）
        let received = {}; // お預かり額（円）
        let isEditMode = false;
        let showReport = false;
        let showSkipped = false;

        // 保存（このデバイスのブラウザに保存。日付が変わったら箱数・状況はリセット、順序は引き継ぐ）
        const STORAGE_KEY = 'delivery-route-state-v1';

        function todayKey() {
            return new Date().toLocaleDateString('ja-JP');
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    date: todayKey(),
                    order: routeList.map(item => item.id),
                    quantities,
                    itemStatuses,
                    collections,
                    received
                }));
            } catch (e) {}
        }

        function loadState() {
            let saved;
            try {
                saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
            } catch (e) {}
            if (!saved) return;
            if (Array.isArray(saved.order)) {
                const byId = new Map(initialDeliveryData.map(item => [item.id, item]));
                const ordered = saved.order.filter(id => byId.has(id)).map(id => byId.get(id));
                const rest = initialDeliveryData.filter(item => !saved.order.includes(item.id));
                routeList = JSON.parse(JSON.stringify(ordered.concat(rest)));
            }
            if (saved.date === todayKey()) {
                quantities = saved.quantities || {};
                itemStatuses = saved.itemStatuses || {};
                collections = saved.collections || {};
                received = saved.received || {};
            }
        }

        window.resetToday = function() {
            if (!confirm('本日の箱数・完了状況をすべてリセットしますか？')) return;
            quantities = {};
            itemStatuses = {};
            collections = {};
            received = {};
            render();
            showToast('リセットしました');
        };

        // ピン位置（店舗ごとの緯度経度）。日付が変わっても残す
        const PIN_KEY = 'delivery-route-pins-v1';
        let pins = {};
        try { pins = JSON.parse(localStorage.getItem(PIN_KEY)) || {}; } catch (e) {}

        function savePins() {
            try { localStorage.setItem(PIN_KEY, JSON.stringify(pins)); } catch (e) {}
        }

        let pinMap = null;
        let pinMarker = null;
        let pinEditingId = null;
        const DEFAULT_CENTER = [35.6812, 139.7671]; // 東京駅

        window.openPinEditor = function(id) {
            if (!window.L) {
                showToast('地図を読み込めませんでした。通信状況を確認してください。');
                return;
            }
            const item = routeList.find(i => i.id === id);
            pinEditingId = id;
            document.getElementById('pin-title').innerText = `${item.name} のピン位置`;
            document.getElementById('pin-reset').style.display = pins[id] ? '' : 'none';
            document.getElementById('pin-modal').classList.remove('hidden');

            const start = pins[id] ? [pins[id].lat, pins[id].lng] : DEFAULT_CENTER;
            if (!pinMap) {
                pinMap = L.map('pin-map');
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '&copy; OpenStreetMap contributors'
                }).addTo(pinMap);
                pinMarker = L.marker(start, { draggable: true }).addTo(pinMap);
                pinMap.on('click', e => pinMarker.setLatLng(e.latlng));
            }
            pinMarker.setLatLng(start);
            pinMap.setView(start, pins[id] ? 18 : 15);
            setTimeout(() => pinMap.invalidateSize(), 50);

            // 未設定なら現在地から始める（店の前で開くことを想定）
            if (!pins[id]) pinToCurrentLocation(true);
        };

        window.pinToCurrentLocation = function(silent) {
            if (!navigator.geolocation) {
                if (!silent) showToast('現在地を取得できません');
                return;
            }
            navigator.geolocation.getCurrentPosition(pos => {
                const ll = [pos.coords.latitude, pos.coords.longitude];
                pinMarker.setLatLng(ll);
                pinMap.setView(ll, 18);
            }, () => {
                if (!silent) showToast('現在地を取得できませんでした（位置情報の許可を確認してください）');
            }, { enableHighAccuracy: true, timeout: 10000 });
        };

        window.closePinEditor = function() {
            document.getElementById('pin-modal').classList.add('hidden');
            pinEditingId = null;
        };

        window.savePin = function() {
            const ll = pinMarker.getLatLng();
            pins[pinEditingId] = { lat: +ll.lat.toFixed(6), lng: +ll.lng.toFixed(6) };
            savePins();
            closePinEditor();
            render();
            showToast('ピン位置を保存しました');
        };

        window.resetPin = function() {
            delete pins[pinEditingId];
            savePins();
            closePinEditor();
            render();
            showToast('住所での案内に戻しました');
        };

        // 初期化
        function init() {
            loadState();
            render();
        }

        // アクション関数
        window.toggleSkipped = function() {
            showSkipped = !showSkipped;
            render();
        };

        window.toggleEdit = function() {
            isEditMode = !isEditMode;
            render();
        };

        window.toggleReport = function(state) {
            showReport = state;
            render();
            window.scrollTo(0, 0);
        };

        window.changeQty = function(id, delta) {
            if (isEditMode) return;
            const current = quantities[id] || 0;
            quantities[id] = Math.max(0, current + delta);
            render();
        };

        function yen(n) {
            return '¥' + (n || 0).toLocaleString('ja-JP');
        }

        // 入力中は再描画しない（フォーカスが外れないように）。合計は次の再描画時に反映
        function parseYen(value) {
            const n = parseInt(String(value).replace(/[^0-9]/g, ''), 10);
            return n > 0 ? n : 0;
        }

        window.inputCollection = function(id, value) {
            const n = parseYen(value);
            if (n) collections[id] = n; else delete collections[id];
            saveState();
            updateChange(id);
        };

        window.inputReceived = function(id, value) {
            const n = parseYen(value);
            if (n) received[id] = n; else delete received[id];
            saveState();
            updateChange(id);
        };

        // おつり表示（お預かり − 集金額）
        function changeHTML(id) {
            const amount = collections[id] || 0;
            const got = received[id] || 0;
            if (!amount || !got) return '<span class="text-gray-400">お預かり額を入れると計算します</span>';
            const diff = got - amount;
            if (diff >= 0) return `おつり <span class="text-2xl text-green-700 tabular-nums">${yen(diff)}</span>`;
            return `<span class="text-red-600">不足 <span class="text-2xl tabular-nums">${yen(-diff)}</span></span>`;
        }

        function updateChange(id) {
            const el = document.getElementById('change-' + id);
            if (el) el.innerHTML = changeHTML(id);
        }

        // 箱数0の店舗は自動で「配送なし」扱い
        function isDelivering(item) {
            return itemStatuses[item.id] !== 'skipped' && (quantities[item.id] || 0) > 0;
        }

        function collectionTotal() {
            return routeList.reduce((sum, item) => (
                item.payment && isDelivering(item) ? sum + (collections[item.id] || 0) : sum
            ), 0);
        }

        window.setStatus = function(id, status) {
            if (itemStatuses[id] === status) {
                delete itemStatuses[id]; // トグル
            } else {
                itemStatuses[id] = status;
            }
            render();
        };

        window.moveItem = function(index, dir) {
            const target = index + dir;
            if (target < 0 || target >= routeList.length) return;
            const temp = routeList[index];
            routeList[index] = routeList[target];
            routeList[target] = temp;
            render();
        };

        window.copyDeparture = function() {
            const today = new Date().toLocaleDateString('ja-JP');
            let text = `【出発報告】${today}\n\n`;
            let order = 1;
            let activeCount = 0;
            let totalB = 0;
            routeList.forEach((item) => {
                if (isDelivering(item)) {
                    const q = quantities[item.id] || 0;
                    text += `${order}. ${item.name}: ${q}箱${item.payment && collections[item.id] ? ` (集金 ${yen(collections[item.id])})` : ''}\n`;
                    order++;
                    activeCount++;
                    totalB += q;
                }
            });
            text += `\n配送予定件数: ${activeCount}件\n総予定箱数: ${totalB} 箱\n集金予定合計: ${yen(collectionTotal())}\n\n出発します。よろしくお願いします。`;
            executeCopy(text);
        };

        window.copyCompletion = function() {
            const today = new Date().toLocaleDateString('ja-JP');
            let text = `【完了報告】${today}\n\n`;
            let order = 1;
            let activeCount = 0;
            let completedCount = 0;
            let totalB = 0;
            routeList.forEach((item) => {
                if (isDelivering(item)) {
                    const q = quantities[item.id] || 0;
                    const mark = itemStatuses[item.id] === 'completed' ? '完了' : '未完';
                    text += `${order}. ${item.name}: ${q}箱 [${mark}]\n`;
                    if (itemStatuses[item.id] === 'completed') completedCount++;
                    order++;
                    activeCount++;
                    totalB += q;
                }
            });
            text += `\n配送完了件数: ${completedCount}/${activeCount}件\n総納品数: ${totalB} 箱\n`;

            const payItems = routeList.filter(item => item.payment && isDelivering(item));
            if (payItems.length) {
                text += `\n【集金】\n`;
                payItems.forEach(item => {
                    const amount = collections[item.id] ? yen(collections[item.id]) : '金額未入力';
                    const mark = itemStatuses[item.id] === 'completed' ? '' : ' [未完]';
                    text += `${item.name}: ${amount}${mark}\n`;
                });
                text += `集金合計: ${yen(collectionTotal())}\n`;
            }

            text += `\nお疲れ様でした。`;
            executeCopy(text);
        };

        function executeCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast('コピーしました！LINE等に貼り付けてください。');
            } catch (err) {
                showToast('コピーに失敗しました。');
            }
            document.body.removeChild(textArea);
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 3000);
        }

        // 描画処理
        function render() {
            saveState();
            const app = document.getElementById('app');
            if (showReport) {
                app.innerHTML = renderReportHTML();
            } else {
                app.innerHTML = renderMainHTML();
            }
        }

        function renderMainHTML() {
            let activeCount = 0;
            let completedCount = 0;
            let totalB = 0;
            routeList.forEach(item => {
                if (isDelivering(item)) {
                    activeCount++;
                    totalB += (quantities[item.id] || 0);
                    if (itemStatuses[item.id] === 'completed') completedCount++;
                }
            });

            let html = `
                <div class="max-w-md mx-auto min-h-screen pb-20">
                    <header class="bg-blue-700 text-white p-4 sticky top-0 z-10 shadow-lg">
                        <div class="flex justify-between items-center mb-4">
                            <h1 class="text-xl font-bold tracking-wide">本日の配送ルート</h1>
                            <div class="flex gap-2">
                                <button onclick="toggleEdit()" class="px-3 py-1.5 text-sm rounded-lg font-bold transition-all shadow-sm ${isEditMode ? 'bg-yellow-400 text-yellow-900' : 'bg-blue-600 text-white border border-blue-500'}">
                                    ${isEditMode ? '編集完了' : '順序変更'}
                                </button>
                                <button onclick="toggleReport(true)" class="px-4 py-1.5 text-sm bg-white text-blue-700 rounded-lg font-bold shadow-sm">
                                    報告
                                </button>
                            </div>
                        </div>
                        <div class="flex justify-between items-center text-sm font-medium bg-blue-800 p-3 rounded-xl shadow-inner border border-blue-600">
                            <div class="flex flex-col">
                                <span class="text-blue-200 text-xs">進捗状況</span>
                                <span class="text-lg font-bold">${completedCount} <span class="text-sm font-normal">/ ${activeCount} 件</span></span>
                            </div>
                            <div class="w-px h-8 bg-blue-600 mx-2"></div>
                            <div class="flex flex-col text-right">
                                <span class="text-blue-200 text-xs">合計箱数</span>
                                <span class="text-xl font-bold tabular-nums">${totalB} <span class="text-sm font-normal">箱</span></span>
                            </div>
                        </div>
                    </header>
                    <main class="p-4">
            `;

            if (isEditMode) {
                html += `
                    <div class="bg-yellow-50 text-yellow-800 p-3 rounded-xl mb-4 text-sm font-bold flex items-center gap-2 border border-yellow-200 shadow-sm">
                        矢印ボタンでルートの順番を入れ替えられます
                    </div>
                `;
            }

            // 表示用の配送番号（箱数1以上・配送なしでない店舗だけをルート順に数える）
            const numbers = {};
            routeList.filter(isDelivering).forEach((item, i) => { numbers[item.id] = i + 1; });

            const renderCard = (item, index, number) => {
                let html = '';
                const q = quantities[item.id] || 0;
                const status = itemStatuses[item.id];
                const isCompleted = status === 'completed';
                const isAutoSkipped = q === 0 && status !== 'skipped' && !isCompleted;
                const isSkipped = status === 'skipped' || isAutoSkipped;
                const isCollapsed = isCompleted || isSkipped;
                // 車ルートでナビを即開始（スマホの Google マップアプリで開く）
                const pin = pins[item.id];
                const destination = pin ? `${pin.lat},${pin.lng}` : '東京都' + item.address;
                const mapUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(destination)}&travelmode=driving&dir_action=navigate`;

                html += `
                    <div class="bg-white rounded-xl shadow-sm transition-all duration-300 border-l-4 overflow-hidden
                        ${isSkipped ? 'border-gray-300 opacity-60 bg-gray-50 mb-2' : isCompleted ? 'border-green-400 opacity-90 bg-green-50 mb-2' : 'border-blue-500 mb-4'}">
                        <div class="${isCollapsed ? 'p-3' : 'p-4'}">
                            <div class="flex justify-between items-center ${!isCollapsed ? 'mb-3' : ''}">
                                <div class="flex items-center gap-2 overflow-hidden">
                                    <span class="text-sm font-bold w-6 h-6 rounded-full flex items-center justify-center text-white shrink-0 ${isSkipped ? 'bg-gray-400' : isCompleted ? 'bg-green-500' : 'bg-blue-500'}">
                                        ${number || '-'}
                                    </span>
                                    <h2 class="text-lg font-bold truncate ${isSkipped ? 'line-through text-gray-500' : isCompleted ? 'text-gray-700' : 'text-gray-900'}">
                                        ${item.name}
                                    </h2>
                                    ${item.payment && isCompleted ? `<span class="text-xs font-bold text-white bg-red-500 px-2 py-1 rounded-full shrink-0">💴${collections[item.id] ? yen(collections[item.id]) : item.payment}</span>` : ''}
                                    ${isCompleted ? `<span class="text-xs font-bold text-green-700 bg-green-200 px-2 py-1 rounded-full shrink-0">${q}箱</span>` : ''}
                                </div>
                `;

                if (!isEditMode && isAutoSkipped) {
                    html += `
                                <div class="flex items-center gap-2 shrink-0">
                                    <span class="text-xs font-bold text-gray-500">0箱・配送なし</span>
                                    <button onclick="changeQty(${item.id}, 1)" class="w-9 h-9 rounded-full bg-blue-500 text-white text-xl font-bold flex items-center justify-center shadow-sm" title="箱を追加">+</button>
                                </div>
                    `;
                } else if (!isEditMode && isCollapsed) {
                    // 完了・配送なしのカードは状態ラベル＋「戻す」
                    html += `
                                <div class="flex items-center gap-2 shrink-0">
                                    ${isCompleted
                                        ? `<span class="text-xs font-bold text-white bg-green-500 px-2.5 py-1.5 rounded-full">✓ 完了</span>`
                                        : `<span class="text-xs font-bold text-white bg-gray-500 px-2.5 py-1.5 rounded-full">配送なし</span>`}
                                    <button onclick="setStatus(${item.id}, '${isCompleted ? 'completed' : 'skipped'}')" class="px-2.5 py-1.5 rounded-lg text-xs font-bold text-gray-600 bg-white border border-gray-300">
                                        戻す
                                    </button>
                                </div>
                    `;
                } else if (isEditMode) {
                    html += `
                                <div class="flex items-center gap-1 shrink-0">
                                    <button onclick="moveItem(${index}, -1)" ${index === 0 ? 'disabled' : ''} class="w-8 h-8 rounded bg-gray-200 flex items-center justify-center ${index === 0 ? 'opacity-30' : 'active:bg-gray-300'}">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
                                    </button>
                                    <button onclick="moveItem(${index}, 1)" ${index === routeList.length - 1 ? 'disabled' : ''} class="w-8 h-8 rounded bg-gray-200 flex items-center justify-center ${index === routeList.length - 1 ? 'opacity-30' : 'active:bg-gray-300'}">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                                    </button>
                                </div>
                    `;
                }

                html += `</div>`; // end flex header

                if (!isCollapsed) {
                    html += `
                            <div>
                                <div class="flex flex-wrap gap-1.5 mb-2 text-xs font-bold">
                                    ${item.category ? `<span class="bg-gray-100 text-gray-700 px-2 py-1 rounded">${item.category}</span>` : ''}
                                    ${item.frequency ? `<span class="bg-blue-50 text-blue-700 px-2 py-1 rounded">頻度: ${item.frequency}</span>` : ''}
                                    ${item.payment ? `<span class="bg-red-50 text-red-700 border border-red-200 px-2 py-1 rounded">💴 ${item.payment}あり</span>` : ''}
                                </div>
                                <div class="flex items-stretch gap-2 mb-3">
                                    <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="flex-1 min-w-0 text-left flex items-center gap-2 text-sm text-blue-600 bg-blue-50 p-2.5 rounded-lg no-underline">
                                        ${pin ? '📌' : '📍'} <span class="flex-1 truncate">${item.address}</span>
                                        <span class="shrink-0 text-xs font-bold text-white bg-blue-600 px-2.5 py-1 rounded-full">🚗 ナビ開始</span>
                                    </a>
                                    <button onclick="openPinEditor(${item.id})" class="shrink-0 px-2.5 rounded-lg text-xs font-bold border ${pin ? 'bg-orange-50 text-orange-700 border-orange-200' : 'bg-white text-gray-500 border-gray-200'}">
                                        ${pin ? 'ピン<br>設定済' : 'ピン<br>修正'}
                                    </button>
                                </div>
                                <div class="flex items-center justify-between bg-gray-50 p-3 rounded-lg mb-3 border border-gray-100">
                                    <span class="text-gray-700 font-bold text-sm">納品箱数</span>
                                    <div class="flex items-center gap-4">
                                        <button onclick="changeQty(${item.id}, -1)" class="w-10 h-10 rounded-full bg-white border border-gray-300 shadow-sm flex items-center justify-center text-gray-600" ${q <= 0 || isEditMode ? 'disabled' : ''}>-</button>
                                        <span class="text-2xl font-bold w-8 text-center tabular-nums">${q}</span>
                                        <button onclick="changeQty(${item.id}, 1)" class="w-10 h-10 rounded-full bg-blue-500 border border-blue-600 shadow-sm flex items-center justify-center text-white" ${isEditMode ? 'disabled' : ''}>+</button>
                                    </div>
                                </div>
                    `;
                    if (item.payment) {
                        html += `
                                <div class="bg-red-50 p-3 rounded-lg mb-3 border border-red-200 space-y-2">
                                    <label class="flex items-center justify-between">
                                        <span class="text-red-700 font-bold text-sm">💴 集金額</span>
                                        <span class="flex items-center gap-1 text-xl font-bold">
                                            ¥<input type="text" inputmode="numeric" pattern="[0-9]*" placeholder="0"
                                                value="${collections[item.id] ? collections[item.id].toLocaleString('ja-JP') : ''}"
                                                oninput="inputCollection(${item.id}, this.value)" ${isEditMode ? 'disabled' : ''}
                                                class="w-32 text-right bg-white border border-red-300 rounded-lg px-2 py-1.5 tabular-nums">
                                        </span>
                                    </label>
                                    <label class="flex items-center justify-between">
                                        <span class="text-gray-700 font-bold text-sm">お預かり</span>
                                        <span class="flex items-center gap-1 text-xl font-bold">
                                            ¥<input type="text" inputmode="numeric" pattern="[0-9]*" placeholder="0"
                                                value="${received[item.id] ? received[item.id].toLocaleString('ja-JP') : ''}"
                                                oninput="inputReceived(${item.id}, this.value)" ${isEditMode ? 'disabled' : ''}
                                                class="w-32 text-right bg-white border border-gray-300 rounded-lg px-2 py-1.5 tabular-nums">
                                        </span>
                                    </label>
                                    <div id="change-${item.id}" class="text-right text-sm font-bold pt-2 border-t border-red-200">${changeHTML(item.id)}</div>
                                </div>
                        `;
                    }
                    if (item.timeLimit) {
                        html += `<div class="text-sm flex items-start gap-2 text-red-700 bg-red-50 p-2.5 rounded-md mb-2 font-bold border border-red-100">⏰ ${item.timeLimit}</div>`;
                    }
                    if (item.note) {
                        html += `<div class="text-sm flex items-start gap-2 text-yellow-800 bg-yellow-50 p-3 rounded-md border border-yellow-200 leading-relaxed">⚠️ ${item.note}</div>`;
                    }
                    if (!isEditMode) {
                        html += `
                                <button onclick="setStatus(${item.id}, 'completed')" class="w-full mt-4 py-3.5 rounded-xl bg-green-500 active:bg-green-600 text-white text-lg font-bold shadow flex items-center justify-center gap-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                    納品完了
                                </button>
                                <button onclick="setStatus(${item.id}, 'skipped')" class="w-full mt-2 py-2 text-xs font-bold text-gray-400 underline">
                                    今日はこの店に配送しない
                                </button>
                        `;
                    }
                    html += `</div>`; // end not collapsed content
                }
                html += `</div></div>`; // end card
                return html;
            };

            if (isEditMode) {
                // 順序変更中は全店舗をルート順に表示
                routeList.forEach((item, index) => { html += renderCard(item, index, numbers[item.id]); });
            } else {
                // 未完了 → 完了 → 配送なし（折りたたみ）の順に表示
                const pending = [], done = [], skipped = [];
                routeList.forEach((item, index) => {
                    const entry = [item, index];
                    if (!isDelivering(item)) skipped.push(entry);
                    else if (itemStatuses[item.id] === 'completed') done.push(entry);
                    else pending.push(entry);
                });

                pending.forEach(([item, index]) => { html += renderCard(item, index, numbers[item.id]); });

                if (pending.length === 0 && done.length === 0) {
                    html += `
                        <div class="bg-blue-50 text-blue-800 p-4 rounded-xl mb-4 text-sm font-bold border border-blue-200 text-center">
                            配送する店舗がありません。<br>下の「配送なし」の一覧から、箱数を入れる店舗の「+」を押してください。
                        </div>
                    `;
                } else if (pending.length === 0) {
                    html += `
                        <div class="bg-green-50 text-green-800 p-4 rounded-xl mb-4 text-sm font-bold border border-green-200 text-center">
                            🎉 すべての配送が完了しました
                        </div>
                    `;
                }

                if (done.length) {
                    html += `<h3 class="text-xs font-bold text-green-700 mt-6 mb-2">✓ 完了（${done.length}件）</h3>`;
                    done.forEach(([item, index]) => { html += renderCard(item, index, numbers[item.id]); });
                }

                if (skipped.length) {
                    const open = showSkipped || (pending.length === 0 && done.length === 0);
                    html += `
                        <button onclick="toggleSkipped()" class="w-full mt-6 mb-2 py-2.5 px-3 rounded-lg bg-gray-200 text-gray-600 text-sm font-bold flex justify-between items-center">
                            <span>配送なし（${skipped.length}件）</span>
                            <span>${open ? '閉じる ▲' : '表示 ▼'}</span>
                        </button>
                    `;
                    if (open) {
                        skipped.forEach(([item, index]) => { html += renderCard(item, index, null); });
                    }
                }
            }

            html += `</main></div>`;
            return html;
        }

        function renderReportHTML() {
            let activeCount = 0;
            let completedCount = 0;
            let totalB = 0;
            let tableHTML = '';
            const today = new Date().toLocaleDateString('ja-JP');

            routeList.filter(isDelivering).forEach((item, index) => {
                const isCompleted = itemStatuses[item.id] === 'completed';
                const q = quantities[item.id] || 0;

                activeCount++;
                totalB += q;
                if (isCompleted) completedCount++;

                tableHTML += `
                    <tr class="border-b border-gray-200">
                        <td class="p-2">${index + 1}</td>
                        <td class="p-2 font-bold">${item.name}${item.payment ? ' <span class="text-xs text-red-600">💴集金' + (collections[item.id] ? ' ' + yen(collections[item.id]) : '') + '</span>' : ''}</td>
                        <td class="p-2 text-center tabular-nums">${q}</td>
                        <td class="p-2 text-center text-xs font-bold">
                            ${isCompleted ? '<span class="text-green-600">完了</span>' : '<span class="text-red-500">未完</span>'}
                        </td>
                    </tr>
                `;
            });

            if (!tableHTML) {
                tableHTML = `<tr><td colspan="4" class="p-4 text-center text-gray-400">箱数が入力された納品先はありません</td></tr>`;
            }

            return `
                <div class="max-w-md mx-auto min-h-screen bg-gray-50 print-bg" id="report-section">
                    <header class="bg-gray-800 text-white p-4 sticky top-0 z-10 shadow-lg no-print">
                        <div class="flex justify-between items-center">
                            <button onclick="toggleReport(false)" class="px-3 py-1.5 text-sm bg-gray-700 border border-gray-600 rounded-lg font-bold shadow-sm">
                                ← 戻る
                            </button>
                            <h1 class="text-lg font-bold tracking-wide">配送報告</h1>
                            <button onclick="window.print()" class="px-3 py-1.5 text-sm bg-white text-gray-800 rounded-lg font-bold shadow-sm">
                                印刷
                            </button>
                        </div>
                    </header>
                    <main class="p-4">
                        <div class="bg-white rounded-xl shadow-sm p-4 mb-4 border border-gray-200">
                            <h2 class="text-lg font-bold text-gray-900 mb-1">配送報告書</h2>
                            <p class="text-sm text-gray-500 mb-4">${today}</p>
                            <div class="grid grid-cols-2 gap-3">
                                <div class="bg-gray-50 rounded-lg p-3 border border-gray-100">
                                    <span class="block text-xs text-gray-500">配送完了</span>
                                    <span class="text-xl font-bold tabular-nums">${completedCount} <span class="text-sm font-normal">/ ${activeCount} 件</span></span>
                                </div>
                                <div class="bg-gray-50 rounded-lg p-3 border border-gray-100 text-right">
                                    <span class="block text-xs text-gray-500">総箱数</span>
                                    <span class="text-xl font-bold tabular-nums">${totalB} <span class="text-sm font-normal">箱</span></span>
                                </div>
                                <div class="col-span-2 bg-red-50 rounded-lg p-3 border border-red-100 flex justify-between items-center">
                                    <span class="text-xs text-red-700 font-bold">💴 集金合計</span>
                                    <span class="text-xl font-bold tabular-nums text-red-700">${yen(collectionTotal())}</span>
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3 mb-4 no-print">
                            <button onclick="copyDeparture()" class="py-3 rounded-xl bg-blue-600 text-white font-bold shadow-sm active:bg-blue-700">
                                出発報告をコピー
                            </button>
                            <button onclick="copyCompletion()" class="py-3 rounded-xl bg-green-600 text-white font-bold shadow-sm active:bg-green-700">
                                完了報告をコピー
                            </button>
                        </div>

                        <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-200 mb-4">
                            <table class="w-full text-sm">
                                <thead class="bg-gray-100 text-gray-600 text-xs">
                                    <tr>
                                        <th class="p-2 text-left w-8">#</th>
                                        <th class="p-2 text-left">納品先</th>
                                        <th class="p-2 text-center w-14">箱数</th>
                                        <th class="p-2 text-center w-14">状態</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${tableHTML}
                                </tbody>
                            </table>
                        </div>

                        <button onclick="resetToday()" class="w-full py-3 rounded-xl bg-white text-red-600 border border-red-200 font-bold shadow-sm no-print">
                            本日の記録をリセット
                        </button>
                    </main>
                </div>
            `;
        }

        init();
    </script>
</body>
</html>
